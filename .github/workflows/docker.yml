name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Temporary watch for the October 21 security release and Docker image availability.
  # The resolver checks the year and refuses scheduled updates outside this window.
  schedule:
    - cron: "7,22,37,52 * 21-23 10 *"

concurrency:
  group: epay-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Select PHP release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/php-release.py >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.version != ''

      - name: Log in to GHCR
        if: steps.release.outputs.version != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published PHP version
        id: current
        if: steps.release.outputs.version != ''
        env:
          PHP_VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == schedule ]] && docker pull "$image:latest"; then
            current=$(docker run --rm "$image:latest" php -r 'echo PHP_VERSION;')
            if [[ "$current" == "$PHP_VERSION" ]]; then
              echo "PHP $PHP_VERSION is already published."
              exit 0
            fi
            if [[ "$(printf '%s\n' "$current" "$PHP_VERSION" | sort -V | tail -1)" == "$current" ]]; then
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Build candidate with a fresh PHP base
        if: steps.current.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: epay:candidate
          build-args: PHP_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PHP, extensions, and Nginx to FPM requests
        if: steps.current.outputs.build == 'true'
        env:
          PHP_VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/check-image.sh epay:candidate "$PHP_VERSION"

      - name: Publish verified candidate
        id: publish
        if: steps.current.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.current.outputs.image }}
          PHP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="$IMAGE:php-$PHP_VERSION-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID"
          docker tag epay:candidate "$tag"
          docker push "$tag"
          digest=$(docker inspect "$tag" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$IMAGE@sha256:"* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote verified image for Keel
        if: steps.publish.outputs.digest != ''
        env:
          IMAGE: ${{ steps.current.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          PHP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Keel polls this tag inside the cluster; hosted runners cannot reach its API.
          docker tag epay:candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
          printf 'Verified PHP %s image published for Keel: `%s`\n' "$PHP_VERSION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
